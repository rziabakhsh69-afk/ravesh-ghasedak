<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رویش قاصدک</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF4EC;
    --ink:#1E2B27;
    --muted:#5B6B66;
    --leaf:#3B7A57;
    --leaf-dark:#2C5E43;
    --sun:#F2B91D;
    --sky:#D9E9F1;
    --line:#C9D8CF;
    --white:#FFFFFF;
    --danger:#B3261E;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Vazirmatn",Tahoma,sans-serif;line-height:1.9;font-size:16px}
  .hero{background:var(--sky);padding:28px 20px 22px;text-align:center;border-bottom:4px solid var(--sun)}
  .hero svg{width:84px;height:84px}
  .hero h1{margin:6px 0 2px;font-size:34px;font-weight:800;color:var(--leaf-dark)}
  .hero p{margin:0;color:var(--muted);font-size:15px}
  main{max-width:620px;margin:0 auto;padding:22px 18px 40px}
  .intro{margin:0 0 18px;color:var(--muted)}
  label{display:block;font-weight:600;margin:16px 0 4px}
  .hint{font-weight:400;color:var(--muted);font-size:13px}
  input[type=text],input[type=email],input[type=password],textarea{
    width:100%;padding:11px 12px;font:inherit;border:1.5px solid var(--line);border-radius:10px;background:var(--white);color:var(--ink)}
  textarea{min-height:110px;resize:vertical}
  input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--sun);outline-offset:1px;border-color:var(--leaf)}
  input[type=file]{width:100%;padding:10px;border:1.5px dashed var(--leaf);border-radius:10px;background:var(--white);font:inherit}
  button{font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:10px;padding:13px 20px}
  .primary{width:100%;margin-top:22px;background:var(--leaf);color:#fff;font-size:17px}
  .primary:hover{background:var(--leaf-dark)}
  .primary:disabled{opacity:.6;cursor:wait}
  .ghost{background:transparent;color:var(--leaf-dark);padding:6px 4px;text-decoration:underline;font-weight:400}
  .msg{margin-top:16px;padding:12px 14px;border-radius:10px;display:none}
  .msg.ok{display:block;background:#E1F1E6;border:1.5px solid var(--leaf);color:var(--leaf-dark)}
  .msg.err{display:block;background:#FBE9E7;border:1.5px solid var(--danger);color:var(--danger)}
  footer{max-width:620px;margin:0 auto;padding:0 18px 36px;text-align:center;color:var(--muted);font-size:14px;border-top:1px solid var(--line);padding-top:18px}
  footer p{margin:2px 0}
  .card{background:var(--white);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;margin:14px 0}
  .card h3{margin:0 0 2px;font-size:18px;color:var(--leaf-dark)}
  .meta{color:var(--muted);font-size:13px;margin:0 0 8px}
  .card img,.card video{width:100%;max-height:340px;object-fit:contain;background:#0001;border-radius:8px;margin-top:8px}
  .bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .hidden{display:none}
</style>
</head>
<body>

<header class="hero">
  <svg viewBox="0 0 100 100" aria-hidden="true">
    <path d="M50 52 C50 70 46 84 40 96" stroke="#3B7A57" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M46 80 C36 78 30 70 28 64 C38 64 44 70 46 80Z" fill="#3B7A57"/>
    <g stroke="#F2B91D" stroke-width="2.4" stroke-linecap="round">
      <line x1="50" y1="40" x2="50" y2="10"/><line x1="50" y1="40" x2="71" y2="19"/>
      <line x1="50" y1="40" x2="80" y2="40"/><line x1="50" y1="40" x2="71" y2="61"/>
      <line x1="50" y1="40" x2="29" y2="61"/><line x1="50" y1="40" x2="20" y2="40"/>
      <line x1="50" y1="40" x2="29" y2="19"/><line x1="50" y1="40" x2="62" y2="12"/>
      <line x1="50" y1="40" x2="38" y2="12"/><line x1="50" y1="40" x2="77" y2="28"/>
      <line x1="50" y1="40" x2="23" y2="28"/>
    </g>
    <g fill="#F2B91D"><circle cx="50" cy="10" r="3"/><circle cx="71" cy="19" r="3"/><circle cx="80" cy="40" r="3"/>
      <circle cx="29" cy="19" r="3"/><circle cx="20" cy="40" r="3"/><circle cx="62" cy="12" r="3"/>
      <circle cx="38" cy="12" r="3"/><circle cx="77" cy="28" r="3"/><circle cx="23" cy="28" r="3"/></g>
    <circle cx="50" cy="40" r="6" fill="#3B7A57"/>
  </svg>
  <h1>رویش قاصدک</h1>
  <p>زیر نظر موسسه معراج اندیشه گل‌گهر</p>
</header>

<!-- فرم همکاران -->
<main id="formView">
  <p class="intro">همکار گرامی، اطلاعات و تصویر یا فیلم فعالیت خود را در این فرم ثبت کنید. فقط مدیر سایت آن را می‌بیند.</p>
  <form id="form" novalidate>
    <label for="full_name">نام و نام خانوادگی</label>
    <input type="text" id="full_name" maxlength="120" autocomplete="name">

    <label for="school">مدرسه</label>
    <input type="text" id="school" maxlength="120">

    <label for="activity_title">عنوان فعالیت</label>
    <input type="text" id="activity_title" maxlength="160">

    <label for="activity_description">توضیح فعالیت</label>
    <textarea id="activity_description" maxlength="3000"></textarea>

    <label for="photo">عکس فعالیت <span class="hint">(اختیاری، حداکثر ۵۰ مگابایت)</span></label>
    <input type="file" id="photo" accept="image/*">

    <label for="video">فیلم فعالیت <span class="hint">(اختیاری، حداکثر ۵۰ مگابایت)</span></label>
    <input type="file" id="video" accept="video/*">

    <button type="submit" class="primary" id="sendBtn">ارسال فعالیت</button>
    <div id="formMsg" class="msg" role="status"></div>
  </form>
</main>

<!-- بخش مدیر -->
<main id="adminView" class="hidden">
  <div id="loginBox">
    <h2>ورود مدیر سایت</h2>
    <label for="adm_email">ایمیل</label>
    <input type="email" id="adm_email" dir="ltr" autocomplete="username">
    <label for="adm_pass">رمز عبور</label>
    <input type="password" id="adm_pass" dir="ltr" autocomplete="current-password">
    <button class="primary" id="loginBtn">ورود</button>
    <div id="loginMsg" class="msg" role="status"></div>
  </div>
  <div id="panel" class="hidden">
    <div class="bar"><h2 id="count">فعالیت‌های ثبت‌شده</h2><button class="ghost" id="logoutBtn">خروج</button></div>
    <div id="list"></div>
  </div>
</main>

<footer>
  <p>مدیر سایت: رقیه ضیابخش</p>
  <p><button class="ghost" id="toggleAdmin">ورود مدیر</button></p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://rpbqnnzsammouarzvjqa.supabase.co";
  const SUPABASE_KEY = "sb_publishable_l9wuYzzcgFXoRCvF0pXq8A_wa-woXnl";
  const BUCKET = "activities";
  const MAX_BYTES = 50 * 1024 * 1024;

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const $ = (id) => document.getElementById(id);

  function show(el, text, type){ el.textContent = text; el.className = "msg " + type; }
  function clear(el){ el.textContent = ""; el.className = "msg"; }

  function extOf(file){
    const e = (file.name.split(".").pop() || "").toLowerCase().replace(/[^a-z0-9]/g, "");
    return e || "bin";
  }

  async function uploadFile(file, folder, base){
    const path = folder + "/" + base + "." + extOf(file);
    const { error } = await db.storage.from(BUCKET).upload(path, file, { contentType: file.type, upsert: false });
    if (error) throw error;
    return path;
  }

  // ---------- فرم همکاران ----------
  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = $("formMsg"); clear(msg);

    const name = $("full_name").value.trim();
    const title = $("activity_title").value.trim();
    const photo = $("photo").files[0];
    const video = $("video").files[0];

    if (!name) return show(msg, "نام و نام خانوادگی را وارد کنید.", "err");
    if (!title) return show(msg, "عنوان فعالیت را وارد کنید.", "err");
    if (photo && photo.size > MAX_BYTES) return show(msg, "حجم عکس بیشتر از ۵۰ مگابایت است. عکس کوچک‌تری انتخاب کنید.", "err");
    if (video && video.size > MAX_BYTES) return show(msg, "حجم فیلم بیشتر از ۵۰ مگابایت است. فیلم کوتاه‌تر یا فشرده‌تری انتخاب کنید.", "err");

    const btn = $("sendBtn");
    btn.disabled = true; btn.textContent = "در حال ارسال... لطفاً صفحه را نبندید";
    try {
      const folder = crypto.randomUUID();
      const photo_path = photo ? await uploadFile(photo, folder, "photo") : null;
      const video_path = video ? await uploadFile(video, folder, "video") : null;

      const { error } = await db.from("submissions").insert({
        full_name: name,
        school: $("school").value.trim() || null,
        activity_title: title,
        activity_description: $("activity_description").value.trim() || null,
        photo_path, video_path
      });
      if (error) throw error;

      $("form").reset();
      show(msg, "فعالیت شما ثبت شد. سپاسگزاریم.", "ok");
    } catch (err) {
      console.error(err);
      show(msg, "ارسال انجام نشد. اینترنت خود را بررسی کنید و دوباره تلاش کنید. (" + (err.message || "خطای نامشخص") + ")", "err");
    } finally {
      btn.disabled = false; btn.textContent = "ارسال فعالیت";
    }
  });

  // ---------- بخش مدیر ----------
  function openAdmin(open){
    $("formView").classList.toggle("hidden", open);
    $("adminView").classList.toggle("hidden", !open);
    $("toggleAdmin").textContent = open ? "بازگشت به فرم" : "ورود مدیر";
    if (open) refreshAdmin();
  }
  $("toggleAdmin").addEventListener("click", () => {
    const opening = $("adminView").classList.contains("hidden");
    location.hash = opening ? "admin" : "";
    openAdmin(opening);
  });

  async function refreshAdmin(){
    const { data } = await db.auth.getSession();
    const logged = !!data.session;
    $("loginBox").classList.toggle("hidden", logged);
    $("panel").classList.toggle("hidden", !logged);
    if (logged) loadList();
  }

  $("loginBtn").addEventListener("click", async () => {
    const msg = $("loginMsg"); clear(msg);
    const { error } = await db.auth.signInWithPassword({
      email: $("adm_email").value.trim(), password: $("adm_pass").value
    });
    if (error) return show(msg, "ایمیل یا رمز عبور درست نیست.", "err");
    $("adm_pass").value = "";
    refreshAdmin();
  });

  $("logoutBtn").addEventListener("click", async () => { await db.auth.signOut(); refreshAdmin(); });

  async function signed(path){
    if (!path) return null;
    const { data, error } = await db.storage.from(BUCKET).createSignedUrl(path, 3600);
    return error ? null : data.signedUrl;
  }

  async function loadList(){
    const list = $("list");
    list.textContent = "در حال بارگذاری...";
    const { data, error } = await db.from("submissions").select("*").order("created_at", { ascending: false });
    if (error) { list.textContent = "خطا در دریافت اطلاعات: " + error.message; return; }
    $("count").textContent = "فعالیت‌های ثبت‌شده: " + data.length.toLocaleString("fa-IR");
    list.textContent = "";
    if (!data.length) { list.textContent = "هنوز فعالیتی ثبت نشده است."; return; }

    for (const row of data) {
      const card = document.createElement("div"); card.className = "card";
      const h = document.createElement("h3"); h.textContent = row.activity_title; card.appendChild(h);
      const m = document.createElement("p"); m.className = "meta";
      m.textContent = row.full_name + (row.school ? " - " + row.school : "") + " - " +
        new Date(row.created_at).toLocaleString("fa-IR");
      card.appendChild(m);
      if (row.activity_description) {
        const d = document.createElement("p"); d.textContent = row.activity_description; card.appendChild(d);
      }
      const [pUrl, vUrl] = await Promise.all([signed(row.photo_path), signed(row.video_path)]);
      if (pUrl) { const i = document.createElement("img"); i.src = pUrl; i.alt = row.activity_title; card.appendChild(i); }
      if (vUrl) { const v = document.createElement("video"); v.src = vUrl; v.controls = true; v.preload = "metadata"; card.appendChild(v); }
      list.appendChild(card);
    }
  }

  if (location.hash === "#admin") openAdmin(true);
</script>
</body>
</html>
